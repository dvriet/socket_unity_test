<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
Welcome to the Socket.IO Unity Browser Client Example!

<script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
<script>
    const socket = io('https://socket-unity-test.onrender.com');

    socket.on('connect', () => {
        console.log('Connected to server as browser client');
    });

    socket.on('messageToBrowser', (data) => {
        console.log('Message from Unity:', data);
    });

    // Send a message to Unity via the server
    function sendMessageToUnity() {
        socket.emit('messageFromBrowser', {text: 'Hello from browser!'});
    }
</script>
<button onclick="sendMessageToUnity()">Send to Unity</button>

</body>
</html>
